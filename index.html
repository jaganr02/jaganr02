<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R JAGAN - GitHub Profile Preview</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 32px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .markdown-body {
      background: transparent !important;
      color: #c9d1d9 !important;
      font-size: 14.5px;
    }

    .markdown-body img {
      max-width: 100%;
      background-color: transparent !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <article id="markdown-container" class="markdown-body">
      <p style="text-align: center; color: #8b949e;">Loading GitHub profile README...</p>
    </article>
  </div>

  <script>
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      gfm: true,
      breaks: true
    });

    fetch('README.md?v=' + Date.now())
      .then(res => res.text())
      .then(md => {
        document.getElementById('markdown-container').innerHTML = marked.parse(md);
        
        // Handle images that fail before pushing to GitHub
        document.querySelectorAll('#markdown-container img').forEach(img => {
          img.onerror = function() {
            if (this.src.includes('github-contribution-grid-snake')) {
              this.src = 'assets/contribution-snake.svg';
            }
          };
        });
      })
      .catch(err => {
        document.getElementById('markdown-container').innerHTML = '<p style="color: #f85149;">Error loading README.md</p>';
      });
  </script>
</body>
</html>
